name = "ssac-app"
compatibility_date = "2025-01-01"
pages_build_output_dir = "dist"

# Bind D1. Create with:
#   npx wrangler d1 create ssac-app
# Then paste the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "ssac-app"
database_id = "47fca4a8-8993-428c-a693-5c0956067bf5"

# Workers AI binding (no API key needed)
[ai]
binding = "AI"

# GEMINI_API_KEY is kept as fallback — can be removed once Workers AI is stable
